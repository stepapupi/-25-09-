<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Заявление на регистрацию брака — Лабораторная 6</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <h1>Начало вашей<br />общей истории</h1>
        <p>Заявление на регистрацию брака</p>
      </header>
      <form id="marriage-form">
        <p class="form-note">
          Заполните все поля, кроме отчества и дополнительных пожеланий.
        </p>
        <fieldset>
          <legend><span>01</span> Заявитель 1</legend>
          <div class="fields">
            <div class="field">
              <label for="person-1-surname">Фамилия</label
              ><input
                id="person-1-surname"
                name="person-1-surname"
                type="text"
                placeholder="Фамилия"
                aria-label="Фамилия"
                required
                maxlength="80"
                autocomplete="family-name"
              />
            </div>
            <div class="field">
              <label for="person-1-name">Имя</label
              ><input
                id="person-1-name"
                name="person-1-name"
                type="text"
                placeholder="Имя"
                aria-label="Имя"
                required
                maxlength="80"
                autocomplete="given-name"
              />
            </div>
            <div class="field">
              <label for="person-1-patronymic">Отчество</label
              ><input
                id="person-1-patronymic"
                name="person-1-patronymic"
                type="text"
                placeholder="Отчество"
                aria-label="Отчество"
                maxlength="80"
                autocomplete="additional-name"
              />
            </div>
            <div class="field always-caption">
              <label for="person-1-birth">Дата рождения</label
              ><input
                id="person-1-birth"
                name="person-1-birth"
                type="date"
                aria-label="Дата рождения заявителя 1"
                required
              />
            </div>
            <div class="field">
              <label for="person-1-citizenship">Гражданство</label
              ><input
                id="person-1-citizenship"
                name="person-1-citizenship"
                type="text"
                placeholder="Гражданство"
                aria-label="Гражданство"
                required
                list="citizenships"
                maxlength="80"
              />
            </div>
            <div class="field">
              <label for="person-1-passport">Документ: серия и номер</label
              ><input
                id="person-1-passport"
                name="person-1-passport"
                type="text"
                placeholder="Документ: серия и номер"
                aria-label="Документ: серия и номер"
                required
                maxlength="40"
              />
            </div>
            <div class="field">
              <label for="person-1-address">Адрес проживания</label
              ><input
                id="person-1-address"
                name="person-1-address"
                type="text"
                placeholder="Адрес проживания"
                aria-label="Адрес проживания"
                required
                autocomplete="street-address"
                maxlength="250"
              />
            </div>
            <div class="field">
              <label for="person-1-new-surname">Фамилия после регистрации</label
              ><input
                id="person-1-new-surname"
                name="person-1-new-surname"
                type="text"
                placeholder="Фамилия после регистрации"
                aria-label="Фамилия после регистрации"
                required
                maxlength="80"
              />
            </div>
          </div>
        </fieldset>
        <fieldset>
          <legend><span>02</span> Заявитель 2</legend>
          <div class="fields">
            <div class="field">
              <label for="person-2-surname">Фамилия</label
              ><input
                id="person-2-surname"
                name="person-2-surname"
                type="text"
                placeholder="Фамилия"
                aria-label="Фамилия"
                required
                maxlength="80"
                autocomplete="family-name"
              />
            </div>
            <div class="field">
              <label for="person-2-name">Имя</label
              ><input
                id="person-2-name"
                name="person-2-name"
                type="text"
                placeholder="Имя"
                aria-label="Имя"
                required
                maxlength="80"
                autocomplete="given-name"
              />
            </div>
            <div class="field">
              <label for="person-2-patronymic">Отчество</label
              ><input
                id="person-2-patronymic"
                name="person-2-patronymic"
                type="text"
                placeholder="Отчество"
                aria-label="Отчество"
                maxlength="80"
                autocomplete="additional-name"
              />
            </div>
            <div class="field always-caption">
              <label for="person-2-birth">Дата рождения</label
              ><input
                id="person-2-birth"
                name="person-2-birth"
                type="date"
                aria-label="Дата рождения заявителя 2"
                required
              />
            </div>
            <div class="field">
              <label for="person-2-citizenship">Гражданство</label
              ><input
                id="person-2-citizenship"
                name="person-2-citizenship"
                type="text"
                placeholder="Гражданство"
                aria-label="Гражданство"
                required
                list="citizenships"
                maxlength="80"
              />
            </div>
            <div class="field">
              <label for="person-2-passport">Документ: серия и номер</label
              ><input
                id="person-2-passport"
                name="person-2-passport"
                type="text"
                placeholder="Документ: серия и номер"
                aria-label="Документ: серия и номер"
                required
                maxlength="40"
              />
            </div>
            <div class="field">
              <label for="person-2-address">Адрес проживания</label
              ><input
                id="person-2-address"
                name="person-2-address"
                type="text"
                placeholder="Адрес проживания"
                aria-label="Адрес проживания"
                required
                autocomplete="street-address"
                maxlength="250"
              />
            </div>
            <div class="field">
              <label for="person-2-new-surname">Фамилия после регистрации</label
              ><input
                id="person-2-new-surname"
                name="person-2-new-surname"
                type="text"
                placeholder="Фамилия после регистрации"
                aria-label="Фамилия после регистрации"
                required
                maxlength="80"
              />
            </div>
          </div>
        </fieldset>
        <fieldset>
          <legend><span>03</span> Регистрация</legend>
          <div class="fields">
            <div class="field always-caption">
              <label for="office">Место регистрации</label
              ><select id="office" name="office" required>
                <option value="" disabled selected>Выберите отдел ЗАГС</option>
                <optgroup label="Учебные отделы">
                  <option value="central">Центральный отдел</option>
                  <option value="north">Северный отдел</option>
                  <option value="south">Южный отдел</option>
                </optgroup>
              </select>
            </div>
            <div class="field always-caption">
              <label for="ceremony-date">Желаемая дата</label
              ><input
                type="date"
                id="ceremony-date"
                name="ceremony-date"
                required
              />
            </div>
            <div class="field always-caption">
              <label for="ceremony-time">Желаемое время</label
              ><input
                type="time"
                id="ceremony-time"
                name="ceremony-time"
                min="09:00"
                max="17:00"
                required
              />
            </div>
            <div class="field">
              <label for="guests">Количество гостей</label
              ><input
                id="guests"
                name="guests"
                type="number"
                placeholder="Количество гостей"
                aria-label="Количество гостей"
                required
                min="0"
                max="100"
                step="1"
              />
            </div>
          </div>
          <div class="choice-group">
            <p id="ceremony-label">Формат регистрации</p>
            <div class="choices" role="group" aria-labelledby="ceremony-label">
              <label class="choice"
                ><input type="radio" name="ceremony" value="solemn" required />
                Торжественная</label
              ><label class="choice"
                ><input type="radio" name="ceremony" value="simple" required />
                Без церемонии</label
              >
            </div>
          </div>
        </fieldset>
        <fieldset>
          <legend><span>04</span> Контакты и пожелания</legend>
          <div class="fields">
            <div class="field">
              <label for="email">Электронная почта</label
              ><input
                id="email"
                name="email"
                type="email"
                placeholder="Электронная почта"
                aria-label="Электронная почта"
                required
                autocomplete="email"
                maxlength="150"
              />
            </div>
            <div class="field">
              <label for="phone">Контактный телефон</label
              ><input
                id="phone"
                name="phone"
                type="tel"
                placeholder="Контактный телефон"
                aria-label="Контактный телефон"
                required
                autocomplete="tel"
                maxlength="25"
              />
            </div>
            <div class="field full">
              <label for="wishes">Дополнительные пожелания</label
              ><textarea
                id="wishes"
                name="wishes"
                rows="4"
                maxlength="1500"
                placeholder="Дополнительные пожелания (необязательно)"
                aria-label="Дополнительные пожелания"
              ></textarea>
            </div>
          </div>
        </fieldset>
        <datalist id="citizenships">
          <option value="Россия"></option>
          <option value="Беларусь"></option>
          <option value="Казахстан"></option>
          <option value="Другое"></option>
        </datalist>
        <div class="form-footer">
          <label class="choice consent"
            ><input type="checkbox" id="consent" name="consent" required />
            Подтверждаю правильность введённых учебных данных</label
          >
          <div class="actions">
            <button type="submit">
              Подать заявление <span aria-hidden="true">→</span></button
            ><button type="reset" class="secondary">Очистить форму</button>
          </div>
          <p id="form-status" class="status" role="status"></p>
        </div>
      </form>
      <section id="result" class="result" aria-labelledby="result-title" hidden>
        <h2 id="result-title" tabindex="-1">Введённые данные</h2>
        <div id="result-details"></div>
      </section>
    </main>
  </body>
</html>
