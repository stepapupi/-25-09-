<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Лабораторная работа 2 — вариант 7</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Вариант 7: getRandomArray(7) = [2, 2, 3, 4, 1]. -->
    <div class="layout">
      <div class="red">
        <div class="cell b10" style="--color: #cd5c5c">#CD5C5C</div>
        <div class="cell b11" style="--color: #dc143c">#DC143C</div>
        <div class="cell b12" style="--color: #8b0000">#8B0000</div>
      </div>
      <div class="pink">
        <div class="pink-stack">
          <div class="cell b20" style="--color: #ffc0cb">#FFC0CB</div>
          <div class="cell b21" style="--color: #ff69b4">#FF69B4</div>
        </div>
        <div class="cell b22" style="--color: #c71585">#C71585</div>
      </div>
      <div class="green">
        <div class="green-side">
          <div class="cell b30" style="--color: #adff2f">#ADFF2F</div>
          <div class="cell b31" style="--color: #00ff00">#00FF00</div>
          <div class="cell b32" style="--color: #32cd32">#32CD32</div>
        </div>
        <div class="green-main">
          <div class="green-column col-a">
            <div class="cell b33" style="--color: #00fa9a">#00FA9A</div>
            <div class="cell b34" style="--color: #2e8b57">#2E8B57</div>
          </div>
          <div class="green-column col-b">
            <div class="cell b35" style="--color: #006400">#006400</div>
            <div class="cell b36" style="--color: #9acd32">#9ACD32</div>
          </div>
          <div class="green-column col-c">
            <div class="cell b37" style="--color: #808000">#808000</div>
            <div class="cell b38" style="--color: #66cdaa">#66CDAA</div>
          </div>
          <div class="green-column col-d">
            <div class="cell b39" style="--color: #556b2f">#556B2F</div>
            <div class="cell b40" style="--color: #008080">#008080</div>
          </div>
        </div>
      </div>
      <div class="orange">
        <div class="cell b50" style="--color: #ffa07a">#FFA07A</div>
        <div class="cell b51" style="--color: #ff4500">#FF4500</div>
        <div class="cell b52" style="--color: #ffa500">#FFA500</div>
      </div>
      <div class="brown">
        <div class="brown-small">
          <div class="cell b62" style="--color: #d2691e">#D2691E</div>
          <div class="cell b63" style="--color: #8b4513">#8B4513</div>
          <div class="cell b64" style="--color: #a52a2a">#A52A2A</div>
          <div class="cell b65" style="--color: #800000">#800000</div>
        </div>
        <div class="brown-tall">
          <div class="cell b60" style="--color: #bc8f8f">#BC8F8F</div>
          <div class="cell b61" style="--color: #f4a460">#F4A460</div>
        </div>
      </div>
    </div>
  </body>
</html>
