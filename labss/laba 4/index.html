<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Лабораторная работа 4 — вариант 7</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Лабораторная работа 4 <span>Вариант 7</span></h1>

      <section>
        <h2>1. Паровоз</h2>
        <div
          class="landscape"
          role="img"
          aria-label="Красно-зелёный паровоз с тремя колёсами и дымом из трубы"
        >
          <div class="train">
            <div class="smoke"></div>
            <div class="chimney"></div>
            <div class="cab"></div>
            <div class="boiler"></div>
            <div class="lamp"></div>
            <div class="chassis"></div>
            <div class="wheel wheel-small"></div>
            <div class="wheel wheel-middle"></div>
            <div class="wheel wheel-large"></div>
            <div class="rod"></div>
          </div>
        </div>
      </section>

      <section>
        <h2>2. Образование молекул воды</h2>
        <p class="equation">O<sub>2</sub> + 2H<sub>2</sub> → 2H<sub>2</sub>O</p>
        <div class="reaction">
          <input type="checkbox" id="pause" />
          <label for="pause">Пауза</label>
          <div
            class="vessel"
            role="img"
            aria-label="Одна молекула кислорода и две молекулы водорода сближаются и образуют две молекулы воды"
          >
            <div class="molecule oxygen-pair">
              <span class="oxygen">O</span><span class="oxygen">O</span>
            </div>
            <div class="molecule hydrogen-pair hydrogen-top">
              <span>H</span><span>H</span>
            </div>
            <div class="molecule hydrogen-pair hydrogen-bottom">
              <span>H</span><span>H</span>
            </div>
            <div class="molecule water water-top">
              <span class="oxygen">O</span><span>H</span><span>H</span>
            </div>
            <div class="molecule water water-bottom">
              <span class="oxygen">O</span><span>H</span><span>H</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
